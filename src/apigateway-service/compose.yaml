services:
  cab_api_gateway_service:
    container_name: api-gateway-service
    image: api-gateway
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      - EUREKA.CLIENT.SERVICE_URL.DEFAULT_ZONE=http://eureka-server:8761/eureka/
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - services

networks:
  services:
    external: true