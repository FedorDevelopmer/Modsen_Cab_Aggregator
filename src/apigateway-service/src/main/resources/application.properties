server.port=8088
spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.cloud.gateway.discovery.locator=enabled
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.routes[0].id=driver-service
spring.cloud.gateway.routes[0].uri=lb://DRIVER-SERVICE-CLIENT
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/drivers/**
spring.cloud.gateway.routes[0].predicates[1]=Method=GET
spring.cloud.gateway.routes[1].id=passenger-service
spring.cloud.gateway.routes[1].uri=lb://PASSENGER-SERVICE-CLIENT
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/passengers/**
spring.cloud.gateway.routes[1].predicates[1]=Method=GET
spring.cloud.gateway.routes[2].id=ride-service
spring.cloud.gateway.routes[2].uri=lb://RIDE-SERVICE-CLIENT
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/rides/**
spring.cloud.gateway.routes[2].predicates[1]=Method=GET
spring.cloud.gateway.routes[3].id=rating-service
spring.cloud.gateway.routes[3].uri=lb://RATING-SERVICE-CLIENT
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/scores/**
spring.cloud.gateway.routes[3].predicates[1]=Method=GET
