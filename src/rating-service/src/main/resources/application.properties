server.port=8083
spring.application.name=rating-service-client
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:48002/ratingdb
spring.datasource.username=user
spring.datasource.password=UltraStrongPassw0rd
spring.liquibase.change-log=classpath:db/changelog/changelog_root.xml
spring.liquibase.enabled=true
rating-service.drivers.url=http://localhost:8080/api/v1/drivers
rating-service.passengers.url=http://localhost:8081/api/v1/passenger
# Kafka Producer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Kafka Consumer Configuration
spring.kafka.consumer.group-id=rating-evaluation
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

