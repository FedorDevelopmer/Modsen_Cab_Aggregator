server.port=8083
spring.application.name=rating-service-client
spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5433/ratingdb
spring.datasource.username=user
spring.datasource.password=UltraStrongPassw0rd
spring.liquibase.change-log=classpath:db/changelog/changelog_root.xml
spring.liquibase.enabled=true
rating-service.drivers.url=http://localhost:8080/api/v1/drivers
rating-service.passengers.url=http://localhost:8081/api/v1/passenger
# Kafka Producer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Kafka Consumer Configuration
spring.kafka.consumer.group-id=rating-evaluation
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.instance.preferIpAddress=true
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
spring.zipkin.base-url=http://localhost:9411/
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8090/realms/CabAggregatorRealm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8090/realms/CabAggregatorRealm/protocol/openid-connect/certs
jwt.auth.resource-id=cab_aggregator_client
jwt.auth.grant-type=password
jwt.auth.principal-attribute=preferred_username
jwt.auth.communication.username=interservice
jwt.auth.communication.password=12345

