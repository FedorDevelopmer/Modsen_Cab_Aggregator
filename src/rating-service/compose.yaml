services:
  cab_rating_service:
    image: rating_service
    container_name: rating_service_container
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://rating_postgres_db/ratingdb
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=UltraStrongPassw0rd
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka_service:9092
      - EUREKA.CLIENT.SERVICE_URL.DEFAULT_ZONE=http://eureka-server:8761/eureka/
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - services

  postgres_rating:
    container_name: rating_postgres_db
    image: postgres
    environment:
      POSTGRES_DB: "ratingdb"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "UltraStrongPassw0rd"
    ports:
      - "48002:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d ratingdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - services

networks:
  services:
    external: true