version: '3.8'

services:
  cab_ride_service:
    image: ride_service
    container_name: ride_service_container
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://rides_postgres_db/ridesdb
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=UltraStrongPassw0rd
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka_service:9092
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - services

  postgres_rides:
    container_name: rides_postgres_db
    image: postgres
    environment:
      POSTGRES_DB: "ridesdb"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "UltraStrongPassw0rd"
    ports:
      - "48001:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d ridesdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - services


networks:
  services:
    external: true