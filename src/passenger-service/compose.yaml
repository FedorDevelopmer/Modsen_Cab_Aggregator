services:
  cab_passenger_service:
    image: passenger_service
    container_name: passenger_service_container
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://passengers_postgres_db/passengerdb
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=UltraStrongPassw0rd
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka_service:9092
      - EUREKA.CLIENT.SERVICE_URL.DEFAULT_ZONE=http://eureka-server:8761/eureka/
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - services

  postgres_passengers:
    container_name: passengers_postgres_db
    image: postgres
    environment:
      POSTGRES_DB: "passengerdb"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "UltraStrongPassw0rd"
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d passengerdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - services

networks:
  services:
    external: true